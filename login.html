<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CZR STORE — Login</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="login" class="login-page">
  <div class="login-shell">
    <div class="login-card">
      <p class="eyebrow">ACESSO</p>
      <h1>Entrar na conta</h1>
      <p class="sub">Use seu usuário e senha para acessar o histórico.</p>

      <form id="loginForm" class="login-form">
        <label for="usuario">Usuário</label>
        <input id="usuario" type="text" placeholder="Digite seu usuário" />

        <label for="senha">Senha</label>
        <input id="senha" type="password" placeholder="Digite sua senha" />

        <button type="submit" class="btn-primary">Entrar</button>
        <p id="msgErro" class="msg-erro" aria-live="polite"></p>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
